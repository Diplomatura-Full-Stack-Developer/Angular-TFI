<footer class="bg-gray-600 text-white/80">
  <div class="mx-auto w-full max-w-7xl p-4 py-6 lg:py-8">
    <div class="md:flex md:justify-between">
      <div class="mb-6 md:mb-0">
        <img src="images/brand/Logo_Plug_&_Hogar.png" alt="logo" class="h-12 md:h-16 p-2" />
      </div>
      <div class="grid grid-cols-2 gap-8 sm:gap-6 sm:grid-cols-3">
        <div>
          <h2 class="mb-6 text-heading uppercase"></h2>
          <ul class="text-body font-medium">
            @for (item of menuItems(); track item.label) {
              <li class="mb-4">
                <a [routerLink]="item.routerLink" class="hover:underline">{{ item.label }}</a>
              </li>
            }
          </ul>
        </div>
      </div>
    </div>
    <hr class="my-6 border-default sm:mx-auto lg:my-8" />
    <div class="sm:flex sm:items-center sm:justify-between">
      <span class="text-sm text-body sm:text-center"
        >© 2026 <a href="/" class="hover:underline">Plug & Hogar</a>. Todos los derechos reservados.
      </span>
      <div
        class="flex flex-row justify-center md:justify-between md:items-center gap-4 mt-4 md:mt-0"
      >
        <mat-icon class="text-white w-6 h-6" svgIcon="brand-facebook"></mat-icon>
        <mat-icon class="text-white w-6 h-6" svgIcon="brand-instagram"></mat-icon>
        <mat-icon class="text-white w-6 h-6" svgIcon="brand-whatsapp"></mat-icon>
      </div>
    </div>
  </div>
</footer>
