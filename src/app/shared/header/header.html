<header
  class="bg-primary-100 w-full h-16 flex justify-between items-center sticky top-0 z-10 flex-row p-4 md:px-48 flex-col md:flex-row gap-2 md:gap-0"
>
  <app-navbar></app-navbar>
  <img src="images/brand/Logo_Plug_&_Hogar.png" alt="logo" class="h-12 md:h-16 p-2" />

  <div class="flex flex-row items-center gap-4 justify-between items-center">
    <button class="cursor-pointer" matIconButton (click)="openCart()">
      <mat-icon class="transition-opacity duration-300 text-primary-500! hover:text-primary-600!"
        >shopping_cart</mat-icon
      >
      <span>{{ cart()?.length ? cart()?.length : '' }}</span>
    </button>
    <h1 class="text-lg">{{ setTitle() }}</h1>
  </div>
</header>
