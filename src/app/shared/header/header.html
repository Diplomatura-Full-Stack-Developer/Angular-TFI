<header
  class="bg-primary-100 w-full flex justify-between items-center flex-row px-4 md:px-48 flex-col md:flex-row gap-2 md:gap-0"
>
  <app-navbar></app-navbar>
  <img src="images/brand/Logo_Plug_&_Hogar.png" alt="logo" class="h-12 md:h-16 p-2" />

  <div class="flex flex-row items-center gap-4 justify-between items-center">
    @if (session() !== undefined) {
      <button class="cursor-pointer relative" matIconButton (click)="openCart()">
        <mat-icon class="transition-opacity duration-300 text-primary-500! hover:text-primary-600!"
          >shopping_cart</mat-icon
        >
        <span
          class="absolute top-0 right-0 rounded-full bg-accent-700! text-white/80! px-1 text-xs font-bold translate-x-1/2 -translate-y-1/2"
          >{{ totalCartQuantity() ? totalCartQuantity() : '' }}</span
        >
      </button>
    }
    <h1 class="text-lg">{{ setTitle() }}</h1>
  </div>
</header>
