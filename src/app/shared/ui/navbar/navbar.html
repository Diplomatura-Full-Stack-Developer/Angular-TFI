<nav class="flex justify-end items-center gap-2 hidden md:block">
  <ul class="flex flex-row gap-4 text-sm font-bold cursor-pointer items-center">
    @for (item of menuItems(); track item.label) {
      <li class="hover:text-primary-500 transition-colors duration-300">
        @if (item.routerLink) {
          <a [routerLink]="item.routerLink">{{ item.label }}</a>
        } @else {
          <button mat-menu-item (click)="item.action?.()">{{ item.label }}</button>
        }
      </li>
    }
  </ul>
</nav>

<nav class="flex justify-end items-center gap-2 block md:hidden">
  <button matIconButton [matMenuTriggerFor]="menu" aria-label="Example icon-button with a menu">
    <mat-icon>dehaze</mat-icon>
  </button>
  <mat-menu #menu="matMenu">
    @for (item of menuItems(); track item.label) {
      @if (item.routerLink) {
        <button mat-menu-item [routerLink]="item.routerLink">
          {{ item.label }}
        </button>
      } @else {
        <button mat-menu-item (click)="item.action?.()">{{ item.label }}</button>
      }
    }
  </mat-menu>
</nav>
