@for (product of cart(); track product.id) {
  <div class="flex items-center justify-between">
    <img [src]="product.imageUrl" [alt]="product.category" />
    <h2>{{ product.category }}</h2>
    <p>{{ product.brand }} {{ product.model }}</p>
    <p>{{ product.price | currency: 'ARS' : 'symbol-narrow' : '1.2-2' }}</p>
    <p>{{ product.stock }}</p>
    <p>{{ product.quantity }}</p>
    <button
      matIconButton
      (click)="removeProductFromCart(product.id)"
      class="text-accent-600! hover:text-accent-700! cursor-pointer text-2xl"
    >
      <mat-icon>delete</mat-icon>
    </button>
  </div>
} @empty {
  <h2 class="text-2xl font-bold text-center text-primary-500! mt-10">
    No hay productos en el carrito
  </h2>
}
